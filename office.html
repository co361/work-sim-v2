<style>
  html,body{margin:0;height:100%;background:#eceae6;font:13px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden;color:#eee}

  #bubbles{position:fixed;left:0;top:0;width:0;height:0;z-index:5;pointer-events:none}

  /* 선택지 패널 (질문·보고·방문) */
  #choice{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.97);color:#2a2422;border-radius:14px;padding:12px 14px;width:min(520px,calc(100vw - 40px));box-shadow:0 6px 24px rgba(0,0,0,.22);display:none}

  #choice button:hover{background:#ffd76b;border-color:#c9a227}
  /* 34차: 방 전환 페이드(복도 ↔ 방). 시뮬 시간으로 보간하므로 헤드리스 step 에서도 같은 순서로 진행 */
  #fade{position:fixed;inset:0;background:#f4f2ee;opacity:0;pointer-events:none;z-index:7;display:flex;align-items:center;justify-content:center}
  #fadetx{font:600 14px/1.4 -apple-system,system-ui,sans-serif;color:#6b6459;letter-spacing:.02em}
  /* 39차: 다가가면 뜨는 조작 안내. 대표 「대사가 이것 때문에 가려져」 → 머리 위가 아니라 화면 하단 가운데 작은 알약으로 내렸다(말풍선과 자리가 겹치지 않는다) */
  #prompt{position:fixed;left:50%;bottom:54px;z-index:4;transform:translateX(-50%);background:rgba(32,29,34,.62);color:#f0e6d2;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none;display:none}
  #prompt b{color:#ffe9a8;font-weight:700}
  #hud select{padding:5px 8px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(40,36,42,.85);color:#f2ede4;font-size:12px}
  /* 35차: 모바일 가상 조이스틱 (터치 기기에서만 표시, embed 모드에서도 남는다) */
  #pad{position:fixed;left:18px;bottom:18px;width:108px;height:108px;border-radius:50%;background:rgba(40,36,42,.28);border:1px solid rgba(255,255,255,.28);z-index:6;display:none;touch-action:none}
  #padk{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,231,170,.75);box-shadow:0 2px 8px rgba(0,0,0,.25)}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightHelper } from 'three/addons/helpers/RectAreaLightHelper.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';   /* 44차 성능: 정적 가구 병합 */

/* ======================================================================
   0. 설정 · 로그
   ====================================================================== */
const Q=new URLSearchParams(location.search);
const TEAM=(Q.get('team')||'cs').toLowerCase();
const TEAM_NAMES={cs:'고객지원팀',logi:'물류팀',acct:'회계팀',ga:'총무팀',rec:'인사팀',plan:'기획팀',qc:'품질팀',pr:'홍보팀',edu:'교육팀',buy:'구매팀'};
const TEAM_NAME=TEAM_NAMES[TEAM]||(TEAM.toUpperCase()+'팀');
document.getElementById('team').textContent=TEAM_NAME+' 사무실';
/* 34차: 복도·타팀 방. HOME = 플레이어 팀(내 방). 복도 문은 TEAM_ORDER 순서(내 팀이 목록에 없으면 끝에 붙인다) */
const HOME=TEAM;
const TEAM_ORDER=['cs','logi','acct','ga','rec','plan','qc','pr','edu','buy'].concat(TEAM_NAMES[TEAM]?[]:[TEAM]);
/* 타 팀 방 NPC 배정표 — docs/plan-office.md §10 (팀장 → lead 석, 사수 → senior 석, 주임 → chief 석).
   이름은 ~/co-work-sim/docs/story/_writing-brief.md §5, 성별은 gallery.html 의 ROLES 기준. 쓸 수 있는 얼굴은 acnh_17~46 에서 플레이어(25)를 뺀 29명인데
   자리는 10팀 × 3 = 30 이라 한 얼굴만 재사용한다 — buy 엄주임 = cs 이주임(21). cs 를 플레이하면 cs 방은 내 방이라 CAST.cs 가 렌더되지 않으므로 그때는 겹치지 않는다.
   (cs 내 방은 30차 배정 그대로 30·31·19·33 이라 cs 플레이 때만 19=ga 최주임, 33=pr 표주임 이 두 방에 나뉘어 나온다 — 29명으로는 피할 수 없는 최소값) */
/* 인물 배치 — **서른 명을 한 번씩만** 쓴다(대표 「다른 사무실에 있어도 동일하게 생기면 안 돼」).
   43차 이전에는 고객상담팀 방이 CAST 와 별개로 하드코딩된 목록을 써서 acnh_19(총무팀 최주임)와
   acnh_33(홍보팀 표주임)이 두 방에 동시에 있었다. 그 목록을 없애고 여기 한 곳에서만 정한다.

   자리는 서른다섯(플레이어 1 + 고객상담팀 4 + 아홉 팀 각 3 + 통행인 3)인데 인물은 서른이다.
   Meshy 잔액이 31 크레딧이라 새로 만들 수 없어(한 명에 47~61), 모자란 다섯은
   **머리색·머리 모양·피부톤을 바꾼 변형**으로 채운다. 원본과 같은 방에는 절대 두지 않는다.
   네 번째 값이 그 겉모습이다. */
const CAST={
  cs:  [['acnh_30','김민아 팀장'],['acnh_31','박선임'],['acnh_21','이주임'],['acnh_19','윤사원']],
  logi:[['acnh_45','강태호 팀장'],['acnh_23','오대리'],['acnh_18','장주임']],
  acct:[['acnh_34','서지현 팀장'],['acnh_39','한주임'],['acnh_20','문주임']],
  ga:  [['acnh_24','이재훈 팀장'],['acnh_22','최주임'],['acnh_26','권주임']],
  rec: [['acnh_35','노윤아 팀장'],['acnh_17','김선임'],['acnh_29','홍주임']],
  plan:[['acnh_41','조성민 팀장'],['acnh_42','류선임'],['acnh_38','신주임']],
  qc:  [['acnh_27','배정훈 팀장'],['acnh_28','남선임'],['acnh_32','도주임']],
  pr:  [['acnh_40','황서연 팀장'],['acnh_44','진선임'],['acnh_33','표주임']],
  edu: [['acnh_43','문경수 팀장'],['acnh_46','손선임'],['acnh_36','반주임']],
  /* 44차: 구선임·엄주임을 새로 만든 acnh_47·48 로 교체 — 전에는 acnh_23(물류팀 오대리)·acnh_29(인사팀 홍주임)를
     색만 바꿔 재사용해 얼굴이 겹쳤다(대표 「다른 사무실에 있어도 동일하게 생기면 안 돼」). 이제 모델 자체가 다르다 */
  buy: [['acnh_37','양지훈 팀장'],
        ['acnh_47','구선임'],
        ['acnh_48','엄주임']],
};
/* 통행인 — 복도에서만 보인다. 사무실 사람과 겹치지 않게 겉모습을 크게 바꾼다 */
const PASSER_LOOK=[
  ['acnh_22',{hairCol:'#6b4a30',hairSide:0.14,skinCol:'#efc49f'}],
  ['acnh_28',{hairCol:'#2b2320',hairTop:0.10,hairBack:0.08}],
  ['acnh_36',{hairCol:'#7a5638',hairSide:0.10,hairTop:0.06,skinCol:'#f6d3b0'}],
];
const CAST_SEATS=['lead','senior','chief','staff'];   /* 43차: 고객상담팀의 네 번째 자리까지 여기서 채운다 */
const NOCHAR=Q.get('nochar')==='1';               /* 방만 볼 때 (캐릭터 없이) */
const PLAYER_CH=Q.get('player')||'acnh_25';       /* 39차: 엔진이 고른 플레이어 캐릭터(성별 반영). 없으면 종전과 같은 acnh_25 */
/* 39차(대표 「앉을 때 앉는 과정 생략해버려」): sitdown·standup 클립은 중간 프레임에서 몸이 의자·책상을 뚫는 장면이 그대로 노출된다.
   기본은 재생하지 않고 짧은 플래시 뒤 최종 자세로 스냅한다. 클립은 지우지 않았고 ?anim=1 로 다시 켤 수 있다 */
const PEND_SHADOW=Q.get('pend')==='1';   /* 44차: 펜던트 전구 그림자. **기본 끔** —
   대표가 Intel HD 630 윈도우 PC 에서 켠 것/끈 것을 직접 비교하고 「디자인적으로 크게 문제가 생기지는 않는것 같아」로 확인.
   점광 5개 × 큐브 6면 = 프레임당 그림자 패스 30번이라 내장 그래픽에서 35 → 48fps. ?pend=1 로 되켤 수 있다.
   **모듈 스코프에 둔다** — 예전에는 buildRoom 안에 있어서 화질 조절(applyQuality)에서 보이지 않아
   「PEND_SHADOW is not defined」로 페이지가 통째로 죽었다. */
const ANIM_SIT=Q.get('anim')==='1';
const ARMFIX=Q.get('armfix')!=='0';   /* 41차: 걷기 팔 각도 하한. ?armfix=0 이면 옛 동작(비교 스냅용) */
const NPC_LIMIT=Q.has('npc')?+Q.get('npc'):4;      /* NPC 수(0~4) */
const EMBED=Q.get('embed')==='1';                   /* 30차: play.html 이 iframe 무대로 쓸 때 — HUD·힌트·마커 숨김, __office 는 그대로 노출 */
const EXTRA_NPC=(Q.get('extra')||Q.get('seats')||'').split(',').filter(Boolean).map(s=>s.split(':'));   /* 30차: ?extra=staff2:acnh_39 — 빈 좌석에 NPC 추가 (docs/office-api-requests.md 는 ?seats= 도 같은 뜻으로 적고 있어 둘 다 받는다) */
const LABELS={};                                    /* 30차: 좌석별 이름표 덮어쓰기(setLabel) — NPC 가 나중에 로드돼도 적용 */
const logEl=document.getElementById('log'); if(Q.get('log')==='1') logEl.style.display='block';
const log=(...a)=>{ logEl.textContent+=a.join(' ')+'\n'; if(Q.get('log')==='1') console.log(...a); };
const status=(s)=>{ document.getElementById('status').textContent=s; };

/* ======================================================================
   1. 치수 (docs/plan-office.md §2 — 게임 단위 = 현실 × 0.59)
   ====================================================================== */
const RW=10.6, RD=8, RH=1.95;              /* 39차: 방 10.6×8, 천장 1.95 (38차까지 8×6×1.53 → 가로세로 1.33배). 인물·가구 크기는 그대로 두고 공간만 넓혀 사람이 상대적으로 작아 보이게 한다 : x[-5.3,5.3] z[-4,4] */
const WALL_TOP=9.0;                        /* 39차: 벽 위로 세우는 「가림막」 꼭대기. 배경색과 같은 무광 판이라 눈에는 배경으로 보이지만, 부감 카메라가 벽 너머 허공을 보지 못하게 막는다 */
const BG_COL='#e4e2de';                    /* 씬 배경색 = 가림막 색 (같아야 이음매가 안 보인다) */
const X0=-RW/2, X1=RW/2, Z0=-RD/2, Z1=RD/2;
const WALL_T=0.08;
const DESK={w:0.71,d:0.35,h:0.42};         /* 1인 책상 */
const LEAD_DESK={w:1.0,d:0.45,h:0.42};     /* 팀장 책상 */
const SEAT_H=0.26;                          /* 의자 좌면 */
const ZF=0.20;                              /* 좌석 중심 → 책상 앞선 (의자 앞선 0.15 + 틈 0.05) */
const SIT_BACK=0;                           /* 39차: 의자는 좌석 제자리(책상 앞)에 그대로 둔다 — 옆으로 밀면 사람이 허공에 앉은 것처럼 보인다 */
const SIT_FWD=0.03;                        /* 39차: 대신 사람을 좌면 위에서 앞으로 5.5cm — 등받이가 등을 뚫지 않으면서 엉덩이는 좌면(깊이 0.30) 안에 남는다 */
const SIT_UP=0.004;                         /* 39차: 엉덩이가 좌면에 파묻히지 않게 살짝 띄운다 */
const WIN={w:0.71,h:0.71,y0:0.53};          /* 창 */
const DOOR={w:0.53,h:1.18};

/* ======================================================================
   2. 렌더러 · 씬 · 카메라
   ====================================================================== */
/* ══ 44차: 자동 화질 조절 ═══════════════════════════════════════════════
   납품 기준 기기가 **Intel HD Graphics 630**(2017 내장 그래픽, 전용 VRAM 없음)으로 확정됐다.
   대표 「리그오브레전드는 돌아가는데 이건 끊긴다」. 학생 40명에게 설정을 만지게 할 수 없으므로
   게임이 스스로 재서 낮춘다. 단계는 4칸이고 **높음은 지금 모습 그대로**다 — 화질을 영구히 걷어내지 않는다.
     높음  지금 그대로(픽셀비 최대 2 · 그림자 전부 · 환경반사 0.3 · 창/천장 면광원)
     보통  펜던트 그림자 끔 · 픽셀비 1.0 상한
     낮음  그림자 전부 끔 · 면광원(RectAreaLight) 끔 · 환경반사 0.15 · 방 미리 받기 끔
     최소  안티에일리어싱 끔 · 렌더 해상도 0.75배 · 환경반사 0
   ?q=high|mid|low|min 으로 고정, ?fps=1 이면 구석에 단계·fps 를 작게 띄운다. */
const QSTEPS=['high','mid','low','min'];
const GPU_NAME=(()=>{ try{ const c=document.createElement('canvas'); const g=c.getContext('webgl2')||c.getContext('webgl'); if(!g) return '';
  const d=g.getExtension('WEBGL_debug_renderer_info'); return d?String(g.getParameter(d.UNMASKED_RENDERER_WEBGL)):''; }catch(e){ return ''; } })();
/* 내장 그래픽·소프트웨어 렌더러는 처음부터 「보통」에서 시작한다 — 높음으로 시작하면 첫 몇 초가 눈에 띄게 끊긴다 */
const GPU_WEAK=/Intel.*(HD|UHD)\s*Graphics|Intel.*Iris|Microsoft Basic|SwiftShader|llvmpipe|Mesa/i.test(GPU_NAME);
const Q_FORCE=QSTEPS.indexOf((Q.get('q')||'').toLowerCase());
let QLV=(Q_FORCE>=0)?Q_FORCE:(GPU_WEAK?1:0);
const QAUTO=(Q_FORCE<0);

/* ══ 44차 성능: 정적 가구 병합 ═════════════════════════════════════════
   대표 PC(Intel HD 630 · 2017 CPU)에서 **창을 1/4 크기로 줄여도 그대로 끊긴다** →
   픽셀(필레이트)이 아니라 **드로우콜 제출(CPU)** 이 병목이라는 뜻이다(프로파일에서 uniformMatrix4fv 38.6%).

   **재질별로 하나의 메시로 합친다.** 화면에 보이는 그림은 픽셀 단위로 같다(무손실).
   건드리지 않는 것:
     · 벽·천장·가림막 — cullWalls 가 개별로 숨긴다
     · 소품(props) — loadProps 가 Meshy 모델로 갈아 끼우고, 의자는 seatFit 가 옮긴다
     · 반투명 재질 — 그리는 순서가 결과를 바꾼다
   충돌(R.SOLIDS)은 buildRoom 안에서 이미 AABB 숫자로 떠 놨으므로 원본 메시를 치워도 안전하다. */
function mergeStatic(R){
  /* 복도는 furn 이 복도 그룹 통째라(벽·문·명패까지 들어 있다) 지금 규칙으로는 위험하다 — 따로 다룬다 */
  if(!R||R.team==='corridor') return {before:0,after:0};
  const furn=R.furn; if(!furn||furn.userData.merged) return {before:0,after:0};
  const byMat=new Map(); let before=0;
  furn.traverse(o=>{ if(!o.isMesh||o.isSkinnedMesh||o.isInstancedMesh) return; before++;
    const m=o.material; if(!m||Array.isArray(m)||m.transparent) return;
    if(!o.geometry||!o.geometry.attributes||!o.geometry.attributes.position) return;
    let a=byMat.get(m); if(!a){ a=[]; byMat.set(m,a); } a.push(o); });
  let merged=0;
  for(const [mat,list] of byMat){
    if(list.length<3) continue;
    const geos=[]; let cast=false;
    for(const o of list){ o.updateMatrixWorld(true); const g=o.geometry.clone();
      /* 합치려면 속성 구성이 같아야 한다 — uv/normal 이 없는 것은 만들어 준다 */
      if(!g.attributes.normal) g.computeVertexNormals();
      if(!g.attributes.uv) g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
      /* 인덱스가 있는 것과 없는 것이 섞이면 mergeGeometries 가 실패한다 — 전부 비인덱스로 맞춘다 */
      const gi=g.index?g.toNonIndexed():g; if(gi!==g) g.dispose();
      for(const k of Object.keys(g.attributes)) if(k!=='position'&&k!=='normal'&&k!=='uv') g.deleteAttribute(k);
      gi.applyMatrix4(o.matrixWorld); geos.push(gi); cast=cast||o.castShadow; }
    let mg=null; try{ mg=mergeGeometries(geos,false); }catch(e){ mg=null; }
    for(const g of geos) g.dispose();
    if(!mg) continue;
    const mesh=new THREE.Mesh(mg,mat); mesh.name='merged'; mesh.castShadow=cast; mesh.receiveShadow=true;
    furn.add(mesh);
    for(const o of list){ if(o.parent) o.parent.remove(o); }
    merged+=list.length-1; }
  furn.userData.merged=true;
  let after=0; furn.traverse(o=>{ if(o.isMesh) after++; });
  log(`[${R.name}] 가구 병합 ${before} → ${after} 메시`);
  return {before,after}; }

/* ---- 현재 방(또는 복도) 참조: 걷기·연출·벽 숨김이 이 변수들을 본다. setRoom 이 갈아 끼운다 ---- */

const ndist=(a,b)=>Math.hypot(NODES[a].x-NODES[b].x,NODES[a].z-NODES[b].z);
function route(from,to){ const dist={},prev={},todo=new Set(Object.keys(NODES)); for(const k of todo) dist[k]=Infinity; dist[from]=0;
  while(todo.size){ let u=null; for(const k of todo) if(u===null||dist[k]<dist[u]) u=k; todo.delete(u); if(u===to) break; for(const v of (ADJ[u]||[])){ const d=dist[u]+ndist(u,v); if(d<dist[v]){ dist[v]=d; prev[v]=u; } } }

function nearestNode(x,z){ let best=null,bd=1e9; for(const k in NODES){ const d=Math.hypot(NODES[k].x-x,NODES[k].z-z); if(d<bd){ bd=d; best=k; } } return best; }
/* Meshy 소품 GLB(assets/props/<type>.glb)가 있으면 임시 소품을 교체한다 — 없으면 조용히 유지. GLB 는 한 번만 받아 방마다 clone (PROP_CACHE) */
const PROP_CACHE={}; let PROP_AVAIL=null;
async function loadProps(R){ if(PROP_AVAIL===null){ PROP_AVAIL=[]; try{ const r=await fetch('assets/props/manifest.json'); if(r.ok) PROP_AVAIL=(await r.json()).types||[]; }catch(e){} }

  for(const t of types){ try{ if(!PROP_CACHE[t]) PROP_CACHE[t]=loader.loadAsync(`assets/props/${t}.glb`).then(async g=>{ noMipMat(g.scene); await islandMipProp(g.scene,t); screenOverlay(t,g.scene); return g.scene; }); const src=await PROP_CACHE[t];   /* 39차 후속 4: 소품 텍스처도 같은 정책(밉맵 ON + 이방성 8) */
      for(const s of R.PROP_SLOTS.filter(s=>s.type===t)){ if(R._slice) await sliceTick();   /* 44차: 미리 받기면 소품 복제도 프레임을 나눠 쓴다 */
        const m=src.clone(true); m.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true; } }); m.position.set(...s.pos); m.rotation.y=s.rot; R.props.add(m);
        const sid=s.node&&s.node.userData&&s.node.userData.seatId; if(sid){ m.userData.seatId=sid; m.userData.slot=s; if(R.SEATS[sid]){ const st=R.SEATS[sid]; st.chair=m;
          if(st.occupant&&st.occupant.seatFit) st.occupant.seatFit(st,ZF-st.occupant.P.deskZ); } }   /* 39차: Meshy 의자로 바뀌면 좌면 높이·앞뒤 보정을 다시 먹인다(35차에는 userData.slot 이 없어 통째로 건너뛰었다) */
        if(s.node){ R.props.remove(s.node); } s.node=m; if(s===R.screenSlot&&CUR===R) SCREEN.node=m; n++; } }catch(e){} }
  if(n) log(`[${R.name}] Meshy 소품 교체 ${n}개`); }

        if(dd>RIG.dead){ const ex=(dd-RIG.dead)/dd, ks=1-Math.exp(-dt*1.7); RIG.tgt.x+=ddx*ex*ks; RIG.tgt.z+=ddz*ex*ks; } }
      /* 방위각은 90° 스냅 조작으로만 — 자동 회전 없음(대표 지시). chase:true 로 되살릴 수 있게 경로는 남긴다 */
      let aim=RIG.base+RIG.turn*Math.PI/2;
      if(RIG.chase&&RIG.follow&&PLAYER&&PLAYER.model.visible) aim=PLAYER.model.rotation.y+Math.PI+RIG.turn*Math.PI/2;
      if(RIG.snap) RIG.yaw=aim; else { const d=shortA(aim-RIG.yaw)*(1-Math.exp(-dt*14)), mx=6.0*dt; RIG.yaw+=Math.max(-mx,Math.min(mx,d)); }   /* 90° 스냅은 0.3초 안에 딱 끊어 돈다 */
      const cp=Math.cos(RIG.pitch);

function doorTick(dt){ for(const d of DOORS){ const h=d.hinge; if(!h) continue; h.rotation.y+=(d.want-h.rotation.y)*Math.min(1,dt*4); } }   /* 34차: 모든 방·복도 문 */
/* 34차: 방 전환 페이드 — 시뮬 시간으로 보간(헤드리스 step 에서도 같은 순서). fadeTo(1) 뒤 0.5초면 완전히 가려진다 */

/* 앉을 때 미끄러지듯 자리로(소파: 서는 자리 → 좌면 위치 0.34 이동을 sitdown 첫 0.8초에 보간) */
const SLIDES=[]; function slideTick(dt){ for(const s of SLIDES.slice()){ s.t+=dt; const k=Math.min(1,s.t/s.dur), e=k*k*(3-2*k); s.c.model.position.x=s.from.x+(s.to.x-s.from.x)*e; s.c.model.position.z=s.from.z+(s.to.z-s.from.z)*e; if(k>=1) SLIDES.splice(SLIDES.indexOf(s),1); } }

/* ======================================================================
   11-3. 조작 안내(39차) — 대표 「문 주변으로 가면 문 여는 키가 뭔지 알려주면 좋겠어 · 가까이 가면 말 걸 수 있게」

   ====================================================================== */
const PROMPT={el:document.getElementById('prompt'),pos:new THREE.Vector3(),text:'',act:null,on:false};
const TALKCB={fn:null}; const TALK_HINT={};
const inZone=(z,x,zz)=>x>z.x0&&x<z.x1&&zz>z.z0&&zz<z.z1;
function doorZoneAt(x,z){ if(CUR===CORRIDOR){ for(const zn of (CUR.zones||[])) if(inZone(zn,x,z)) return zn; return null; }
  const dz=CUR&&CUR.doorZone; return (dz&&inZone(dz,x,z))?dz:null; }
/* 41차(대표 「애네 말거면 자기 자신한테 말해」): 말하는 쪽(npc)에서 이름을 뽑아 자기 이름을 자기가 불렀다.
   ① 부를 이름은 「듣는 쪽」에서 뽑는다. 플레이어에게 하는 말은 이름을 안 붙인다(플레이어 이름표는 '나' 다).
   ② 직함을 떼고 「님」을 붙이면 "한님" 이 된다 — 한국 사무실 호칭이 아니다. label 을 그대로 쓴다("한주임, …").
   ③ 문장이 4개뿐이라 여러 NPC 가 같은 말을 동시에 했다 — 개체 id 해시를 섞어 사람마다 다르게 고른다. */
/* 43차: 주변 잡담은 「짧은 한 마디」로 줄였다(대표 「말풍선으로 말 이렇게 길게 하지마」).
   내용이 있는 이야기는 다가가서 T 를 눌렀을 때만 한다 — 그때는 대화창이 열린다. */
const TALK_LINES=['네, 확인할게요.','올려 뒀어요.','오후에 볼게요.','게시판에 붙여 뒀어요.','바로 할게요.','총무팀 건이에요.','회신 왔어요.','마감 빡세네요.'];
const SOLO_LINES=['커피 한 잔….','어디 뒀더라….','회의 있었지.','복합기 또….','금방 가네.'];
const BUBBLE_MAX=16;   /* 잡담 말풍선 글자 상한 — 넘으면 잘라 「…」 */

const lineFor=(c,list)=>list[(hashOf(c&&c.CH)+Math.floor(SIM_T/6))%list.length];
/* 44차(대표 「T로 말 걸면 좀 얼굴 확대되고 얼굴을 보고 대화하듯 — 동물의 숲처럼」):
   T 로 말을 걸면 얼굴 높이로 카메라가 부드럽게 다가간다. 이미 있던 talkView 리그를 T 경로에서도 켠다.
   끝나면 반드시 원래 시점으로 돌아온다 — play.html 이 talkView(seat,false) 를 안 불러도
   안전 시간(25초)이 지나면 스스로 풀린다(카메라가 갇히지 않게). */
let TALK_OFF=null;
function talkCam(npc,on){
  RIG.talk=on?npc:null; RIG.fast=0.5; RIG.snap=false;
  if(TALK_OFF){ clearTimeout(TALK_OFF); TALK_OFF=null; }
  if(on){ TALK_OFF=setTimeout(()=>{ RIG.talk=null; RIG.fast=0.5; if(PLAYER) PLAYER.look(null); TALK_OFF=null; },25000); } }
function talkTo(npc,seatId){ if(!npc||BUSY) return; npc.look(headOf(PLAYER)); npc.setFace&&npc.setFace('happy');
  /* 몸도 돌린다 — 고개만 돌리면 등을 보이고 말하는 꼴이 된다. 앉은 사람은 책상 방향이 있으므로 고개만 */
  if(PLAYER){ faceTo(PLAYER,headOf(npc)); PLAYER.look(headOf(npc)); }

  /* 39차 후속 3: 하던 일을 멈추고 이쪽을 본다. 대화가 끝나면 원래 하던 일로 돌아간다 */
  if(npc.ai){ npc.ai.talking=true; waitSim(3.6).then(()=>{ npc.ai.talking=false; npc.ai.next=SIM_T+8; npc.look(null); npc.setFace&&npc.setFace('neutral');
      if(!TALKCB.fn){ talkCam(null,false); if(PLAYER) PLAYER.look(null); } }); }

function nearestNpc(x,z,r){ let best=null,bd=r,bid=null; for(const id in SEATS){ const s=SEATS[id]; const o=s.occupant; if(!o||o===PLAYER||!o.model.visible) continue;

/* 44차(대표 「말은 T로만 걸 수 있고 자리에는 E로만 앉을 수 있게 해」):

   둘 다 해당되면 안내 알약에 「E · 앉기 · T · ○○에게 말 걸기」로 함께 띄운다. */
function promptTick(){ const P=PROMPT; P.text=''; P.act=null; P.talk=null;
  if(!CTRL.on||BUSY||!PLAYER||!PLAYER.model.visible||FADE.want>0||CTRL.rising||BUBBLES.length||CHOICE){ P.on=false; return; }   /* 말풍선·선택지·연출 중에는 안내를 띄우지 않는다 */
  const p=PLAYER.model.position;
  /* ── T: 가장 가까운 사람. 앉아 있든 서 있든 상관없다 ── */
  let tTxt='';
  { const nb=nearestNpc(p.x,p.z,1.35);
    if(nb){ const nm=nb.npc.label||SEATS[nb.seat].label;
      tTxt=(TALK_HINT[nb.seat]||`<b>T</b> · ${nm}에게 말 걸기`).replace('<b>E</b>','<b>T</b>');
      P.talk=()=>talkTo(nb.npc,nb.seat); } }
  /* ── E: 좌석 → 문 → 컴퓨터 (사람 없음) ── */
  let eTxt='';
  if(PLAYER.seat){ eTxt='<b>E</b> · 일어서기'+((SEATS&&PLAYER.seat===SEATS.me)?' · 모니터 클릭으로 컴퓨터':''); P.act=ctrlStand; P.pos.set(p.x,0.98,p.z); }
  else {
    const zn=doorZoneAt(p.x,p.z);
    if(zn){ if(zn.team){ eTxt=`<b>E</b> · ${TEAM_NAMES[zn.team]||zn.team} 들어가기`; P.act=()=>goToTeam(zn.team); P.pos.set((zn.x0+zn.x1)/2,1.62,zn.z0+0.06); }
      else { eTxt='<b>E</b> · 복도로 나가기'; P.act=exitToCorridor; P.pos.set(zn.x0+0.1,1.62,(zn.z0+zn.z1)/2); } }
    else {
      /* 43차: **내 자리만** 권한다(대표 「사람 앉아 있는데 내가 앉을 수 있잖아」) */
      const s=SEATS&&SEATS.me;
      if(s&&!s.occupant&&Math.hypot(s.wp(0,0,0).x-p.x,s.wp(0,0,0).z-p.z)<1.1){
        eTxt=`<b>E</b> · ${s.label}에 앉기`; P.act=()=>ctrlSit(s); P.pos.copy(s.wp(0,1.0,0)); }
      else if(SCREEN.node&&SCREEN.cb){ const sl=CUR&&CUR.screenSlot;
        if(sl&&Math.hypot(sl.pos[0]-p.x,sl.pos[2]-p.z)<1.3){ eTxt='<b>클릭</b> · 컴퓨터 켜기'; P.act=SCREEN.cb; P.pos.set(sl.pos[0],sl.pos[1]+sl.size[2]+0.18,sl.pos[2]); } } } }

/* ======================================================================
   12. NPC 상호작용 4종 (co-work-sim/docs/plan-7day-story.md §2-2) — interact(mode, opts) → Promise

const SEQ={
  async deliver(o){ const to=o.to||'senior'; const st=STATIONS[to+'_side']?to+'_side':null; if(!st) throw new Error('전달 상대가 없어요: '+to); const npc=npcAt(to);
    await walkTo(PLAYER,st,{sit:false}); if(!npc){ status(`${SEATS[to].label} 자리에 아무도 없어요`); await playerSay(o.text||'전달드릴 게 있는데… 안 계시네요.',2.4); return {ok:false,present:false}; }

/* ======================================================================
   12-1. 복도·타팀 방 (34차) — goToTeam / roomOf / ensureRoom / resolveSeat
   ====================================================================== */

async function ensureRoom(team,opt){ team=String(team).toLowerCase(); const slice=!!(opt&&opt.slice);
  let R=ROOMS[team];

    try{ R=await roomQueue(async()=>{ let r=ROOMS[team]; if(r) return r;   /* 줄 서 있는 사이에 남이 지었을 수 있다 */

     그 사이에 들어온 두 번째 ensureRoom 이 가드를 통과해 **같은 방을 두 번 채웠다**(한 좌석에 두 명). */

         44차: 미리 받는 방은 반대로 **한 명씩** 받는다 — 다섯 명이 동시에 끝나면
         GLTF 파싱·법선 계산·텍스처 업로드가 한 프레임에 몰려 2.8초짜리 멈춤이 됐다 */

        catch(e){ console.error(e); log(`[${R.name}] NPC ${ch} 실패 ${e.message}`); return null; } };

        used.add(seat);

  if(R.loading) await R.loading; return R; }

function resolveSeat(opts,mode){ const S=SEATS; const to=opts.to; if(to&&S[to]) return to; const name=String(opts.npc||opts.who||'').replace(/\s+/g,'');
  if(name){ for(const id in S){ const lb=String((S[id].occupant&&S[id].occupant.label)||S[id].label||'').replace(/\s+/g,''); if(lb&&(lb===name||lb.includes(name)||name.includes(lb.replace(/팀장$/,'')))) return id; } }

/* 공개 API: goToTeam(team, {mode, npc|who, …}) → 복도를 지나 그 팀 방으로. mode 가 있으면 그 방 NPC 상대로 연출 후 역순 복귀(내 자리 착석).

async function goToTeam(team,opts={}){ if(!PLAYER){ status('플레이어가 아직 없어요'); return null; }
  if(NPC_LOAD&&!HOME_ROOM.loaded) await NPC_LOAD.catch(()=>{}); team=String(team||'').toLowerCase(); if(!isTeamCode(team)){ status('모르는 팀: '+team); return null; }

/* 한 번에 한 연출만. 진행 중 호출은 무시(status). 오류는 reject 대신 status 표시 후 자리로 복귀.

async function interact(mode,opts={}){ if(!PLAYER){ status('플레이어가 아직 없어요'); return; }
  if(NPC_LOAD&&!HOME_ROOM.loaded){ status('동료가 자리에 앉는 중…'); await NPC_LOAD.catch(()=>{}); }   /* 43차 ②: 동료를 뒤에서 채우므로 연출은 여기서 기다린다 */ if(BUSY||walkOf(PLAYER)){ status(`진행 중(${BUSY||'이동'})이라 새 연출을 시작할 수 없어요`); return; } const seq=SEQ[mode]; if(!seq){ status('모르는 상호작용: '+mode); return; }

/* 40차: 방 하나의 걷기 그래프가 가구를 관통하는지 검사한다. 자동 이동은 노드 사이를 직선으로 걷기 때문에 구간이 가구를 지나면 관통이 된다.

      y:+c.model.position.y.toFixed(3), gap:+(mn-(c.P.restFootY||0)).toFixed(3),
      seat:c.seat?c.seat.id:null, errand:(c.ai&&c.ai.busy)?(c.ai.why||'심부름'):''}; }),
  npcState:()=>Object.fromEntries(Object.entries(SEATS||{}).map(([k,s])=>[k,s.occupant?{mode:s.occupant.mode,busy:!!(s.occupant.ai&&s.occupant.ai.busy),why:(s.occupant.ai&&s.occupant.ai.why)||''}:null])),
  passers:()=>PASSERS.list.filter(p=>p.active).length,
  /* 39차: talkView(seatId,on) — 대화 화면. 두 사람이 크게 잡히는 자리로 0.3초에 다가가고 이동 입력을 막는다. off 면 고정 시점 복귀 */
  talkView:(seatId,on)=>{ const npc=(on!==false&&SEATS&&SEATS[seatId])?SEATS[seatId].occupant:null;
    talkCam(npc,!!npc); setControl(!npc);
    if(npc&&PLAYER){ npc.look(headOf(PLAYER)); PLAYER.look(headOf(npc)); } else if(PLAYER){ PLAYER.look(null); }
    return !!npc; },
  setTalkHint:(seatId,text)=>{ if(text) TALK_HINT[seatId]=text; else delete TALK_HINT[seatId]; return true; },
  /* 44차: 「미리 받기」의 뜻을 바꿨다 — 방을 미리 **짓는** 게 아니라 파일만 미리 **받아 둔다**.
     실측(Apple M5, 실제 GPU): 캐릭터 한 명을 만드는 데 CPU 5~6초가 든다(tune·모양 3.0s + 애니 클립 2.6s).
     9개 방 45명을 미리 만들면 273초 동안 프레임이 최대 4.9초씩 멈췄고(4.3fps),
     2048² 텍스처 40장이 GPU 에 얹혀 Intel HD 630 같은 내장 그래픽에서는 메모리까지 넘친다.
     대신 fetch 로 브라우저 HTTP 캐시에만 채워 둔다 — 메인 스레드 비용도 GPU 메모리도 0 이고,
     실제로 그 방에 들어갈 때 네트워크 대기가 사라진다(대표 「처음 들어가는 방에서 로딩이 길다」의 실체).
     ?pre=full 이면 예전처럼 방까지 통째로 미리 짓는다(느린 기기에서는 권하지 않는다). */
  preload:async(teams,opt)=>{ const list=[].concat(teams||[]).map(t=>String(t).toLowerCase()).filter(k=>TEAM_NAMES[k]&&k!==HOME);
    const full=!!(opt&&opt.full);
    PRE.total=list.length; PRE.done=0;
    if(full){ for(const k of list){ try{ await ensureRoom(k,{quiet:true,slice:true}); }catch(e){} PRE.done++;
        for(let i=0;i<6&&!RUSH;i++) await frameSlice(); } return true; }
    for(const k of list){ try{ await warmTeam(k); }catch(e){} PRE.done++; await frameSlice(); }
    return true; },
  preloadInfo:()=>({done:PRE.done,total:PRE.total,rooms:!!window.__officeRoomsReady,frameMs:+LAST_MS.toFixed(1)}),
  quality:(lv)=>{ if(lv!==undefined){ const i=QSTEPS.indexOf(String(lv)); if(i>=0){ QLV=i; applyQuality(); } }
    const i=renderer.info; return {q:QSTEPS[QLV],gpu:GPU_NAME,weak:GPU_WEAK,auto:QAUTO,pixelRatio:renderer.getPixelRatio(),
      calls:i.render.calls,tris:i.render.triangles,textures:i.memory.textures,geometries:i.memory.geometries}; },
  rig:(p)=>{ if(p){ Object.assign(RIG,p); if(p.fov!==undefined){ camera.fov=p.fov; camera.updateProjectionMatrix(); } RIG.snap=true; } return {base:RIG.base,turn:RIG.turn,pitch:RIG.pitch,dist:RIG.dist,fov:camera.fov,follow:RIG.follow,fp:fpActive()}; },
  key:(code,down)=>{ const k=KEYMAP[code]; if(k){ CTRL.keys[k]=down?1:0; if(down){ CTRL.goal=null; CTRL.sitReq=null; } } else if(down&&(code==='KeyE'||code==='Space')) ctrlAct();
    else if(down&&code==='KeyT') ctrlTalk(); },
  /* 34차 */ goToTeam, roomOf, ensureRoom, rooms:()=>Object.fromEntries(Object.entries(ROOMS).map(([k,R])=>[k,{loaded:R.loaded,loadMs:R.loadMs,chars:R.chars.map(c=>c.CH)}])), corridor:()=>CORRIDOR, cur:()=>CUR, get curSEATS(){ return SEATS; }, get curSTATIONS(){ return STATIONS; }, get fade(){ return FADE.a; },
  get walking(){ return walkOf(PLAYER)||null; }, get busy(){ return BUSY; }, get simT(){ return SIM_T; }, freeze:(b)=>{ FROZEN=!!b; }, camFollow:(b)=>{ CAM.enabled=!!b; if(!b){ CAM.follow=false; CAM.restore=null; CAM.saved=null; } },
  snap(q=0.85){ cullWalls(); if(CUR&&CUR.LIGHTS) for(const l of CUR.LIGHTS) l.shadow.needsUpdate=true;   /* 44차: 순번 갱신 때문에 찍는 순간 그림자가 낡을 수 있어 전부 새로 그린다 */
    renderer.render(scene,camera); mipCapTick(true); renderer.render(scene,camera); return renderer.domElement.toDataURL('image/jpeg',q); },   /* 39차 후속 6: 상한이 걸린 뒤 찍히게 강제 적용 후 한 번 더 그린다 */
  mipInfo:()=>({isl:ISLMIP.slice(),cap:MIPCAP,on:MIP_ON,pending:MIPQ.length,done:MIPDONE.slice(),pendingNames:MIPQ.map(t=>(t.image&&t.image.src||'').split('/').pop()||'tex')}),
  view(name){ setView(name); controls.update(); }, ready:()=>!!window.__officeReady, full:()=>!!HOME_ROOM.loaded, npcsReady:()=>NPC_LOAD||Promise.resolve(),   /* 43차 ②: ready = 나만 준비(입장 가능) · full = 동료까지 앉음 */  step(sec,dt=1/30){ for(let t=0;t<sec;t+=dt) simTick(dt); },
  slots:()=>(CUR&&CUR.PROP_SLOTS||HOME_ROOM.PROP_SLOTS).map(s=>({type:s.type,pos:s.pos,rot:s.rot,size:s.size,note:s.note})) };   /* 34차: 방마다 슬롯이 따로라 현재 방 것을 준다 */
</script>
</body>
</html>
